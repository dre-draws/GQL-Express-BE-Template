services:
  local-db:
    image: postgres:15.3
    restart: always
    volumes:
      - db:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${PG_USERNAME:-postgres}
      - PGUSER=${PG_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-password}
      - POSTGRES_DB=${PG_DB:-dev-db}
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "yarn install && yarn dev"
    environment:
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_USERNAME=${PG_USERNAME}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
    ports:
      - "3333:3333"
    depends_on:
      local-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
